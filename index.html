<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Libro Abierto</title>
    
    <!-- Librerías de Firebase (Solo App y Firestore para que sea gratis) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #ffeef5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .bg-heart {
            position: fixed;
            bottom: -50px;
            color: #ff99cc;
            font-size: 24px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            animation: floatBackground 8s linear forwards;
        }

        @keyframes floatBackground {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(45deg); opacity: 0; }
        }

        .controls {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .music-player {
            background: #fff;
            border: 2px solid #ff99cc;
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(255, 153, 204, 0.3);
        }

        .song-title {
            font-size: 12px;
            color: #ff3385;
            font-weight: bold;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }

        .btn {
            background: #fff;
            border: 2px solid #ff99cc;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #ff3385;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(255, 153, 204, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover { background: #ff99cc; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-mini {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #ff3385;
            padding: 2px 6px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .btn-mini:hover { background: #ffeef5; }

        input[type="file"] { display: none; }

        .wrapper {
            position: relative;
            margin-top: 20px;
            z-index: 10;
        }

        .spiderman-lado {
            position: absolute;
            left: -120px;
            top: -50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 0;
        }
        .telarana { width: 2px; height: 150px; background: #999; }
        .spiderman-lado img { 
            width: 150px; 
            height: auto; 
            position: relative;
            left: -15px; 
            top: -10px; 
        }

        .kitty-lado {
            position: absolute;
            right: -150px;
            bottom: 10px;
            z-index: 0;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }
        .kitty-lado img { width: 180px; }

        .book {
            display: flex;
            width: 850px;
            height: 550px;
            background: #fffdf9;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 8px;
            position: relative;
            z-index: 5;
        }

        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 50px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.02) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .page {
            flex: 1;
            position: relative;
            overflow: hidden; 
        }
        .page-left {
            border-right: 1px solid #e0d0b0;
            background: linear-gradient(to right, #fffdf9, #f5ecd9);
            border-radius: 8px 0 0 8px;
        }
        .page-right {
            border-left: 1px solid #fff;
            background: linear-gradient(to left, #fffdf9, #f5ecd9);
            border-radius: 0 8px 8px 0;
        }

        .fecha-chuichito {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 13px;
            color: #d16b93;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px dashed #ffb3d1;
            z-index: 20;
            pointer-events: none;
        }

        .polaroid {
            position: absolute;
            background: white;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            width: 140px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
            border: 2px solid transparent;
        }

        .polaroid img {
            width: 100%;
            height: 120px;
            object-fit: cover; 
            border-radius: 2px;
        }

        @keyframes rgbGlow {
            0% { box-shadow: 0 0 15px #ffb3c6, 0 4px 8px rgba(0,0,0,0.2); border-color: #ffb3c6; }
            50% { box-shadow: 0 0 15px #3399ff, 0 4px 8px rgba(0,0,0,0.2); border-color: #3399ff; }
            100% { box-shadow: 0 0 15px #ff3333, 0 4px 8px rgba(0,0,0,0.2); border-color: #ff3333; }
        }

        .polaroid:hover {
            animation: rgbGlow 1.5s infinite alternate;
            transform: scale(1.08) !important;
            z-index: 30 !important;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal img {
            max-width: 85%;
            max-height: 85%;
            border: 6px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 30px #ffb3c6;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .heart-click {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 9999;
            animation: floatClick 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes floatClick {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5) rotate(20deg); opacity: 0; }
        }

        .pagination {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }
        .page-info {
            font-weight: bold;
            color: #ff3385;
            font-family: 'Courier New', Courier, monospace;
        }
        
        #loading-text {
            color: #ff3385;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="controls-row">
            <label class="btn">
                📸 Agregar Fotos
                <input type="file" id="foto-upload" accept="image/*" multiple>
            </label>

            <!-- Reproductor compacto -->
            <div class="music-player" id="player-container">
                <button class="btn-mini" id="prev-btn" title="Anterior">⏮️</button>
                <button class="btn-mini" id="play-btn" title="Reproducir">▶️</button>
                <button class="btn-mini" id="next-btn" title="Siguiente">⏭️</button>
                <span class="song-title" id="song-title">Lista de reproducción</span>
            </div>
        </div>
        <span id="loading-text">Subiendo foto en tiempo real... ☁️💖</span>
    </div>
    
    <audio id="mi-audio"></audio>

    <div class="wrapper">
        <div class="spiderman-lado">
            <div class="telarana"></div>
            <img src="spiderman.png" alt="Spider-Man">
        </div>
        <div class="kitty-lado">
            <img src="hello.png" alt="Hello Kitty">
        </div>
        <div class="book">
            <div class="spine"></div>
            <div class="page page-left" id="page-left">
                <div class="fecha-chuichito" id="timer">Calculando...</div>
            </div>
            <div class="page page-right" id="page-right">
            </div>
        </div>
    </div>

    <div class="pagination">
        <button id="prev-page" class="btn" disabled>⬅️ Anterior</button>
        <span class="page-info" id="page-indicator">Página 1</span>
        <button id="next-page" class="btn" disabled>Siguiente ➡️</button>
    </div>

    <div class="modal" id="image-modal">
        <img id="modal-img" src="" alt="Zoom">
    </div>

    <script>
        // TUS CLAVES DE FIREBASE (Ya integradas)
        const firebaseConfig = {
            apiKey: "AIzaSyCSK8xabD2BACocXLdVufXlJkVf5doUWGQ",
            authDomain: "album-745ce.firebaseapp.com",
            projectId: "album-745ce",
            storageBucket: "album-745ce.firebasestorage.app",
            messagingSenderId: "478622789278",
            appId: "1:478622789278:web:60ebaa7c9e43d759a5558f",
            measurementId: "G-TVN6E7NC94"
        };
        
        // Inicializar SOLO Firestore (Base de datos)
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Fondo de corazones
        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerText = ['💖', '💕', '🌸', '✨'][Math.floor(Math.random() * 4)];
            const isLeft = Math.random() > 0.5;
            heart.style.left = `${isLeft ? (Math.random() * 15) : (85 + Math.random() * 10)}vw`;
            const duration = Math.random() * 5 + 6;
            heart.style.fontSize = `${Math.random() * 15 + 15}px`;
            heart.style.animationDuration = `${duration}s`;
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }
        setInterval(createBackgroundHeart, 800);

        // 2. Fecha
        const startDate = new Date('2026-09-20T00:00:00');
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            if (diff < 0) {
                document.getElementById('timer').innerText = "¡Próximamente!";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('timer').innerText = `Juntos: ${days} días ❤️`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 3. Corazones al hacer clic
        function spawnHeartsClick(x, y) {
            const corazones = ['💖', '💕', '💘', '💗'];
            for(let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-click';
                heart.innerText = corazones[Math.floor(Math.random() * corazones.length)];
                heart.style.left = `${x + (Math.random() - 0.5) * 60}px`;
                heart.style.top = `${y + (Math.random() - 0.5) * 60}px`;
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 1000);
            }
        }

        // 4. Modal Zoom
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        modal.addEventListener('click', () => { modal.style.display = 'none'; });

        // 5. Álbum en tiempo real
        let albumPhotos = []; 
        let currentPage = 0; 
        const fotosPorPagina = 5; 
        const loadingText = document.getElementById('loading-text');

        const gridLeft = [
            { top: 50,  left: 20 }, { top: 50,  left: 220 }, { top: 200, left: 100 },  
            { top: 340, left: 20 }, { top: 340, left: 220 }, { top: 180, left: 20 }    
        ];
        const gridRight = [
            { top: 50,  left: 30 }, { top: 50,  left: 230 }, { top: 200, left: 120 },  
            { top: 340, left: 30 }, { top: 340, left: 230 }, { top: 180, left: 230 }   
        ];

        const pageLeft = document.getElementById('page-left');
        const pageRight = document.getElementById('page-right');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const pageIndicator = document.getElementById('page-indicator');

        // Escuchar base de datos
        db.collection('album').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
            albumPhotos = [];
            snapshot.forEach(doc => { albumPhotos.push(doc.data()); });
            renderBook();
        });

        // Subir foto comprimida
        function compressAndUploadImage(file) {
            loadingText.style.display = 'block';
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    
                    db.collection('album').add({
                        src: dataUrl,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        loadingText.style.display = 'none';
                    }).catch(error => {
                        console.error(error);
                        loadingText.style.display = 'none';
                    });
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        const fotoUpload = document.getElementById('foto-upload');
        fotoUpload.addEventListener('change', function(event) {
            Array.from(event.target.files).forEach(file => compressAndUploadImage(file));
            fotoUpload.value = ''; 
        });

        function renderBook() {
            pageLeft.innerHTML = currentPage === 0 ? '<div class="fecha-chuichito" id="timer">Calculando...</div>' : '';
            pageRight.innerHTML = '';
            updateTimer(); 

            const totalPhotosPerPage = fotosPorPagina * 2; 
            const startIndex = currentPage * totalPhotosPerPage;
            const endIndex = Math.min(startIndex + totalPhotosPerPage, albumPhotos.length);

            let leftSlotIndex = 0;
            let rightSlotIndex = 0;

            for (let i = startIndex; i < endIndex; i++) {
                const photoData = albumPhotos[i];
                const polaroid = document.createElement('div');
                polaroid.className = 'polaroid';
                
                const img = document.createElement('img');
                img.src = photoData.src;
                polaroid.appendChild(img);
                
                const isLeftPage = (i - startIndex < fotosPorPagina);
                let basePos, slot;

                if (isLeftPage) {
                    slot = leftSlotIndex % gridLeft.length;
                    basePos = gridLeft[slot];
                    leftSlotIndex++;
                } else {
                    slot = rightSlotIndex % gridRight.length;
                    basePos = gridRight[slot];
                    rightSlotIndex++;
                }

                polaroid.style.top = `${basePos.top + Math.floor(Math.random() * 16) - 8}px`;
                polaroid.style.left = `${basePos.left + Math.floor(Math.random() * 16) - 8}px`;
                polaroid.style.transform = `rotate(${Math.floor(Math.random() * 16) - 8}deg)`;
                
                polaroid.addEventListener('click', (mouseEvent) => {
                    spawnHeartsClick(mouseEvent.clientX, mouseEvent.clientY);
                    setTimeout(() => { modalImg.src = img.src; modal.style.display = 'flex'; }, 200);
                });
                
                if (isLeftPage) pageLeft.appendChild(polaroid);
                else pageRight.appendChild(polaroid);
            }

            const maxPages = Math.max(1, Math.ceil(albumPhotos.length / totalPhotosPerPage));
            pageIndicator.innerText = `Página ${currentPage + 1} de ${maxPages}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= maxPages - 1;
        }

        prevBtn.addEventListener('click', () => { if (currentPage > 0) { currentPage--; renderBook(); } });
        nextBtn.addEventListener('click', () => {
            const maxPages = Math.ceil(albumPhotos.length / (fotosPorPagina * 2));
            if (currentPage < maxPages - 1) { currentPage++; renderBook(); }
        });

        // 6. Audio
        const playlist = [
            "cancion1.mp3",
            "cancion2.mp3"
        ];
        
        let currentSongIndex = 0;
        const audioElement = document.getElementById('mi-audio');
        const playBtn = document.getElementById('play-btn');
        const prevSongBtn = document.getElementById('prev-btn');
        const nextSongBtn = document.getElementById('next-btn');
        const songTitle = document.getElementById('song-title');

        function loadSong(index) {
            if (playlist.length > 0 && index >= 0 && index < playlist.length) {
                currentSongIndex = index;
                audioElement.src = playlist[currentSongIndex];
                songTitle.textContent = playlist[currentSongIndex];
            }
        }

        function playAudio() {
            if (playlist.length === 0) return;
            audioElement.play().then(() => { playBtn.innerHTML = '⏸️'; })
            .catch(e => console.log("Asegúrate de tener los MP3 reales en la misma carpeta."));
        }

        function pauseAudio() { audioElement.pause(); playBtn.innerHTML = '▶️'; }

        playBtn.addEventListener('click', function() { audioElement.paused ? playAudio() : pauseAudio(); });

        prevSongBtn.addEventListener('click', function() {
            if (playlist.length <= 1) return;
            loadSong(currentSongIndex - 1 < 0 ? playlist.length - 1 : currentSongIndex - 1);
            playAudio();
        });

        nextSongBtn.addEventListener('click', function() {
            if (playlist.length <= 1) return;
            loadSong(currentSongIndex + 1 >= playlist.length ? 0 : currentSongIndex + 1);
            playAudio();
        });

        audioElement.addEventListener('ended', function() {
            if (playlist.length > 1) { loadSong((currentSongIndex + 1) % playlist.length); playAudio(); }
        });

        window.onload = () => {
            if (playlist.length > 0) loadSong(0);
            else songTitle.textContent = "Sin música configurada";
        };
    </script>
</body>
</html>
